<!DOCTYPE html>

<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#000000",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; }
        .flip-card {
            perspective: 1000px;
        }
        .flip-top {
            clip-path: inset(0 0 50% 0);
        }
        .flip-bottom {
            clip-path: inset(50% 0 0 0);
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-black text-slate-100 transition-colors duration-300">
<div class="relative flex min-h-screen w-full flex-col max-w-3xl mx-auto md:px-8 border-x border-slate-800">
<!-- TopAppBar -->
<div class="flex items-center p-4 pb-2 justify-between">
<a href="index.html" class="text-slate-100 flex size-12 shrink-0 items-center cursor-pointer hover:bg-slate-800 rounded-full justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<h2 class="text-slate-100 text-lg md:text-2xl font-bold leading-tight tracking-tight flex-1 px-2 text-center md:text-left">시계 설정</h2>
<a href="index.html" class="bg-primary text-white px-6 py-2.5 rounded-lg font-medium text-sm md:text-base transition-transform active:scale-95 shadow-lg shadow-primary/20">저장</a>
</div>
<div class="flex flex-col md:grid md:grid-cols-2 gap-8 p-4">
<!-- Left Column: Display Options -->
<div class="flex flex-col gap-8">
<!-- Time Format -->
<section class="flex flex-col gap-4">
<h3 class="text-slate-100 text-lg font-bold leading-tight tracking-tight">시간 형식</h3>
<div class="flex h-12 w-full items-center justify-center rounded-xl bg-slate-900 p-1 border border-slate-800">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-xl px-2 has-[:checked]:bg-slate-800 has-[:checked]:shadow-sm has-[:checked]:text-primary text-slate-400 text-sm font-semibold transition-all">
<span class="truncate">12시간제</span>
<input checked="" class="invisible w-0" name="time-format" type="radio" value="12h"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-xl px-2 has-[:checked]:bg-slate-800 has-[:checked]:shadow-sm has-[:checked]:text-primary text-slate-400 text-sm font-semibold transition-all">
<span class="truncate">24시간제</span>
<input class="invisible w-0" name="time-format" type="radio" value="24h"/>
</label>
</div>
</section>
<!-- Visibility Options -->
<section class="flex flex-col gap-4">
<h3 class="text-slate-100 text-lg font-bold leading-tight tracking-tight">표시 설정</h3>
<div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
<div class="flex flex-col gap-0.5">
<p class="text-slate-100 text-sm font-medium">초 표시</p>
<p class="text-slate-400 text-xs">시계에 초 단위를 보여줍니다.</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input type="checkbox" id="show-seconds-toggle" class="sr-only peer" checked>
<div class="w-11 h-6 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</section>
</div>
<!-- Right Column: Language, Typography & Theme -->
<div class="flex flex-col gap-8">
<!-- Language Selection -->
<section class="flex flex-col gap-4">
<h3 class="text-slate-100 text-lg font-bold leading-tight tracking-tight">언어</h3>
<div class="relative w-full">
<select class="w-full h-12 px-4 appearance-none bg-slate-900 border border-slate-800 rounded-xl text-slate-100 text-sm font-semibold focus:ring-2 focus:ring-primary focus:outline-none cursor-pointer">
<option value="en">English</option>
<option value="ko" selected>한국어</option>
<option value="ja">日本語</option>
<option value="zh">中文</option>
<option value="es">Español</option>
<option value="fr">Français</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</section>
<!-- Typography -->
<section class="flex flex-col gap-4">
<h3 class="text-slate-100 text-lg font-bold leading-tight tracking-tight">글자 크기</h3>
<div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
<div class="flex w-full items-center justify-between mb-2">
<p class="text-slate-100 text-sm font-medium">시계 크기 비율</p>
<p class="text-primary text-sm font-bold" id="digit-size-label">100%</p>
</div>
<div class="flex h-6 w-full items-center gap-4">
<input type="range" id="digit-size-slider" min="50" max="180" step="5" value="100" class="w-full h-1.5 bg-slate-800 rounded-full appearance-none cursor-pointer accent-[#ec5b13]">
</div>
</div>
</section>
<!-- Theme Color -->
<section class="flex flex-col gap-4">
<h3 class="text-slate-100 text-lg font-bold leading-tight tracking-tight">테마 색상</h3>
<div class="flex flex-wrap items-center gap-4">
<button class="size-10 rounded-full border-2 border-slate-700 flex items-center justify-center bg-white transition-transform hover:scale-110" title="White"></button>
<button class="size-10 rounded-full border-2 border-slate-700 flex items-center justify-center bg-[#39ff14] transition-transform hover:scale-110" title="Neon Green"></button>
<button class="size-10 rounded-full border-2 border-slate-700 flex items-center justify-center bg-[#fdfd01] transition-transform hover:scale-110" title="Yellow"></button>
<button class="size-10 rounded-full border-2 border-slate-700 flex items-center justify-center bg-[#0070ff] transition-transform hover:scale-110" title="Blue"></button>
<button class="size-12 rounded-full border-4 border-primary flex items-center justify-center bg-primary shadow-lg scale-110 transition-transform active:scale-105" title="Selected Color">
<span class="material-symbols-outlined text-white text-base">check</span>
</button>
<button class="size-10 rounded-full border-2 border-dashed border-slate-600 flex items-center justify-center transition-transform hover:scale-110" title="Custom Color">
<span class="material-symbols-outlined text-slate-400 text-xl">palette</span>
</button>
</div>
</section>
</div>
</div>
<!-- Footer Decor -->
<div class="mt-auto p-8 flex flex-col items-center opacity-40">
<span class="material-symbols-outlined text-4xl mb-2 text-slate-400">schedule</span>
<p class="text-xs font-display uppercase tracking-widest text-slate-400">플립 시계 v2.4.0</p>
</div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const sizeSlider = document.getElementById("digit-size-slider");
        const sizeLabel = document.getElementById("digit-size-label");
        const secondsToggle = document.getElementById("show-seconds-toggle");
        
        // Load saved settings
        const savedSize = localStorage.getItem("clockFontSize") || 100;
        const savedShowSeconds = localStorage.getItem("clockShowSeconds") !== "false"; // Default to true
        
        sizeSlider.value = savedSize;
        sizeLabel.textContent = `${savedSize}%`;
        secondsToggle.checked = savedShowSeconds;
        
        sizeSlider.addEventListener("input", (e) => {
            const val = e.target.value;
            sizeLabel.textContent = `${val}%`;
            localStorage.setItem("clockFontSize", val);
        });

        secondsToggle.addEventListener("change", (e) => {
            localStorage.setItem("clockShowSeconds", e.target.checked);
        });
    });
</script>
</body></html>
