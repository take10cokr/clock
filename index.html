<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Minimalist Flip Clock</title>
  <!-- Tailwind CSS CDN with forms and container-queries -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style data-purpose="typography">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap');
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #FFFFFF;
      overflow: hidden; /* Prevent scrolling on mobile */
      height: 100vh;
      width: 100vw;
      margin: 0;
    }
  </style>
  <style data-purpose="flip-clock-styles">
    /* Custom styles for the flip card appearance */
    .flip-card {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      background-color: #1a1a1a;
      border-radius: 8px;
      width: 70px;
      height: 100px;
      font-size: 60px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      perspective: 400px;
    }

    /* Responsive sizing */
    @media (min-width: 640px) {
      .flip-card {
        width: 140px;
        height: 200px;
        font-size: 110px;
        border-radius: 12px;
        perspective: 800px;
      }
    }
    
    @media (max-width: 360px) {
      .flip-card {
        width: 50px;
        height: 80px;
        font-size: 40px;
      }
    }

    /* Top and Bottom Halves */
    .top, .bottom, .flap-top, .flap-bottom {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      overflow: hidden;
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .top, .flap-top {
      top: 0;
      align-items: flex-end;
      border-radius: 8px 8px 0 0;
      transform-origin: bottom;
    }
    @media (min-width: 640px) { .top, .flap-top { border-radius: 12px 12px 0 0; } }

    .bottom, .flap-bottom {
      bottom: 0;
      align-items: flex-start;
      border-radius: 0 0 8px 8px;
      transform-origin: top;
    }
    @media (min-width: 640px) { .bottom, .flap-bottom { border-radius: 0 0 12px 12px; } }

    /* The horizontal line simulating the flip mechanism */
    .top::after, .flap-top::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background-color: #000;
    }
    
    .bottom::before, .flap-bottom::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background-color: #000;
    }

    /* Animation initial states */
    .flap-top {
      transform: rotateX(0deg);
      z-index: 2;
    }
    
    .flap-bottom {
      transform: rotateX(90deg);
      z-index: 2;
    }

    .flip-card.flipping .flap-top {
      animation: flipTop 0.3s ease-in forwards;
    }
    
    .flip-card.flipping .flap-bottom {
      animation: flipBottom 0.3s ease-out 0.3s forwards;
    }

    @keyframes flipTop {
      0% { transform: rotateX(0deg); }
      100% { transform: rotateX(-90deg); }
    }

    @keyframes flipBottom {
      0% { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); }
    }
    
    /* Center the text vertically within each half */
    .top span, .flap-top span {
      transform: translateY(50%);
    }
    .bottom span, .flap-bottom span {
      transform: translateY(-50%);
    }
  </style>
</head>
<body class="flex items-center justify-center m-0 p-0 relative">
<!-- BEGIN: MainContent -->
<main class="w-full h-full flex flex-col items-center justify-center bg-black" data-purpose="clock-wrapper">
  
  <!-- Settings Button (Top-Right) -->
  <button aria-label="Settings" onclick="location.href='settings.html'" class="absolute top-6 right-6 text-white opacity-40 hover:opacity-100 transition-opacity duration-300 z-50">
    <span class="material-symbols-outlined text-3xl">settings</span>
  </button>

  <!-- BEGIN: FlipClockContainer -->
  <section class="clock-container flex flex-col sm:flex-row items-center justify-center sm:gap-6 gap-4" data-purpose="flip-clock-display" id="clock-container">
    
    <!-- Hours Card -->
    <div class="flex sm:gap-2 gap-1">
      <div class="flip-card" id="hour-tens">
        <div class="top"><span>0</span></div>
        <div class="bottom"><span>0</span></div>
      </div>
      <div class="flip-card" id="hour-units">
        <div class="top"><span>0</span></div>
        <div class="bottom"><span>0</span></div>
      </div>
    </div>
    
    <!-- Separator (Dots) -->
    <div class="flex flex-row sm:flex-col gap-4 sm:gap-8 my-2 sm:my-0 mx-1 sm:mx-4" data-purpose="time-separator">
      <div class="w-2 h-2 sm:w-3 sm:h-3 bg-white rounded-full"></div>
      <div class="w-2 h-2 sm:w-3 sm:h-3 bg-white rounded-full"></div>
    </div>
    
    <!-- Minutes Card -->
    <div class="flex sm:gap-2 gap-1">
      <div class="flip-card" id="min-tens">
        <div class="top"><span>0</span></div>
        <div class="bottom"><span>0</span></div>
      </div>
      <div class="flip-card" id="min-units">
        <div class="top"><span>0</span></div>
        <div class="bottom"><span>0</span></div>
      </div>
    </div>
    
    <!-- Separator (Dots) -->
    <div class="flex flex-row sm:flex-col gap-4 sm:gap-8 my-2 sm:my-0 mx-1 sm:mx-4" data-purpose="time-separator">
      <div class="w-2 h-2 sm:w-3 sm:h-3 bg-white rounded-full opacity-50"></div>
      <div class="w-2 h-2 sm:w-3 sm:h-3 bg-white rounded-full opacity-50"></div>
    </div>

    <!-- Seconds Card -->
    <div class="flex sm:gap-2 gap-1">
      <div class="flip-card" id="sec-tens">
        <div class="top"><span>0</span></div>
        <div class="bottom"><span>0</span></div>
      </div>
      <div class="flip-card" id="sec-units">
        <div class="top"><span>0</span></div>
        <div class="bottom"><span>0</span></div>
      </div>
    </div>

  </section>
  <!-- END: FlipClockContainer -->

</main>
<!-- END: MainContent -->

<script data-purpose="clock-logic">
  /**
   * Helper function to create the animated flaps
   */
  function createFlapElements(card, prevValue, nextValue) {
    const flapTop = document.createElement('div');
    flapTop.className = 'flap-top';
    flapTop.innerHTML = `<span>${prevValue}</span>`;
    
    const flapBottom = document.createElement('div');
    flapBottom.className = 'flap-bottom';
    flapBottom.innerHTML = `<span>${nextValue}</span>`;
    
    card.appendChild(flapTop);
    card.appendChild(flapBottom);
    
    return { flapTop, flapBottom };
  }

  /**
   * Triggers the flip animation for a specific card if the value changed.
   */
  function flip(cardId, newValue) {
    const card = document.getElementById(cardId);
    if (!card) return;
    
    const top = card.querySelector('.top span');
    const bottom = card.querySelector('.bottom span');
    const currentValue = top.textContent;
    
    if (currentValue === newValue) return;
    
    // 1. Prepare for animation by setting the 'new' text behind the animated flaps
    top.textContent = newValue;
    
    // 2. Create the moving parts
    const { flapTop, flapBottom } = createFlapElements(card, currentValue, newValue);
    
    // 3. Start CSS animation
    card.classList.add('flipping');
    
    // 4. Cleanup after animation completes (0.3s + 0.3s)
    setTimeout(() => {
      bottom.textContent = newValue;
      
      if (card.contains(flapTop)) flapTop.remove();
      if (card.contains(flapBottom)) flapBottom.remove();
      
      card.classList.remove('flipping');
    }, 600);
  }

  /**
   * Updates the clock display every second.
   */
  function updateClock() {
    const now = new Date();
    
    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const seconds = now.getSeconds().toString().padStart(2, '0');

    flip('hour-tens', hours[0]);
    flip('hour-units', hours[1]);
    
    flip('min-tens', minutes[0]);
    flip('min-units', minutes[1]);
    
    flip('sec-tens', seconds[0]);
    flip('sec-units', seconds[1]);
  }

  /**
   * Initialize all clock values instantly without animation
   */
  function initClock() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2, '0');
    const m = now.getMinutes().toString().padStart(2, '0');
    const s = now.getSeconds().toString().padStart(2, '0');
    
    const initCard = (id, val) => {
      const card = document.getElementById(id);
      if (card) {
        card.querySelector('.top span').textContent = val;
        card.querySelector('.bottom span').textContent = val;
      }
    };
    
    initCard('hour-tens', h[0]);
    initCard('hour-units', h[1]);
    initCard('min-tens', m[0]);
    initCard('min-units', m[1]);
    initCard('sec-tens', s[0]);
    initCard('sec-units', s[1]);
  }

  // Apply saved settings
  function applySettings() {
    const savedSize = localStorage.getItem("clockFontSize") || 100;
    const clockContainer = document.getElementById("clock-container");
    if (clockContainer) {
      clockContainer.style.transform = `scale(${savedSize / 100})`;
    }
  }

  // Set initial time
  initClock();
  applySettings();

  // Update time every second
  setInterval(updateClock, 1000);
</script>
</body>
</html>
